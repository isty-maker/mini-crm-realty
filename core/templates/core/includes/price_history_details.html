<details class="price-history-details">
  <summary>История цены</summary>
  {% if chart_markers %}
    <figure class="price-history-chart">
      <svg viewBox="0 0 400 100" role="img" aria-label="Ступенчатый график цены по времени. Точные значения приведены ниже.">
        <path d="{{ chart_path }}" fill="none" stroke="currentColor" stroke-width="2" />
        {% for x, y in chart_markers %}
        <circle cx="{{ x|stringformat:'s' }}" cy="{{ y|stringformat:'s' }}" r="2.5" fill="currentColor" />
        {% endfor %}
      </svg>
      <figcaption>{{ chart_start|date:"d.m.Y H:i:s" }}{% if chart_end %} — {{ chart_end|date:"d.m.Y H:i:s" }}{% endif %}</figcaption>
    </figure>
  {% else %}
    <p>Нет значений для графика.</p>
  {% endif %}
  {% include "core/includes/price_history_entries.html" %}
</details>
