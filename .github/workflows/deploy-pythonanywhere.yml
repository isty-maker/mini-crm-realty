name: Deploy to PythonAnywhere

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment stage
        type: choice
        required: true
        default: dry-run
        options: [dry-run, apply]
      confirm_sha:
        description: Required for apply, enter the full current main SHA
        type: string
        required: false
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.repository == 'isty-maker/mini-crm-realty' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        (inputs.mode == 'dry-run' || inputs.mode == 'apply')) ||
       (github.event_name == 'workflow_run' &&
        vars.PA_AUTO_DEPLOY == 'true' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    concurrency:
      group: pythonanywhere-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Confirm manual apply SHA and successful CI
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.confirm_sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$(git rev-parse HEAD)"
          test "$REQUESTED_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          python - <<'PY'
          import json
          import os
          import urllib.request

          sha = os.environ["REQUESTED_SHA"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs"
              f"?head_sha={sha}&event=push&status=success&per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              runs = json.load(response)["workflow_runs"]
          if not any(
              run["head_sha"] == sha
              and run["head_branch"] == "main"
              and run["event"] == "push"
              and run["conclusion"] == "success"
              and run["path"].endswith("/ci.yml")
              for run in runs
          ):
              raise SystemExit("No successful CI run for this exact main SHA.")
          PY
      - name: Run PythonAnywhere deployment
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PA_USERNAME: ${{ vars.PA_USERNAME }}
          PA_CONSOLE_ID: ${{ vars.PA_CONSOLE_ID }}
          PA_TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PA_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'apply' }}
          PYTHONUNBUFFERED: '1'
        run: python deploy/pa_client.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pythonanywhere-deploy-${{ github.run_attempt }}
          path: pa-deploy.log
          if-no-files-found: ignore
          retention-days: 14
