name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    name: ${{ matrix.check_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: '3.11'
            check_name: tests
          - python_version: '3.12'
            check_name: tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python_version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: Sanity check imports
        run: |
          python -c "import django_filters; print('django_filters OK:', getattr(django_filters,'__version__','?'))"

      - name: Django checks
        run: python manage.py check

      - name: Check pending migrations (advisory)
        run: |
          set +e
          python manage.py makemigrations --check --dry-run --noinput
          code=$?
          if [ "$code" != "0" ]; then
            echo "::warning:: Pending model option migrations detected; continuing (tests remain strict)."
          fi
          exit 0

      - name: Update code index
        env:
          CODE_INDEX_VALIDATE: 0
        run: python scripts/update_code_index.py --no-validate

      - name: Deployment tests
        run: |
          bash -n deploy/deploy
          python -m unittest discover -s deploy -p 'test_*.py'

      - name: Tests
        run: python manage.py test -q
